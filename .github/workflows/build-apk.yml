name: Build APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK (preinstalled on the runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME"; ls $ANDROID_HOME/platforms | tail -3; yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "::error::Add the KEYSTORE_PASSWORD secret (Settings > Secrets and variables > Actions). Not building, so updates keep working."; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/keystore/release.jks.enc -out $RUNNER_TEMP/release.jks -pass env:KEYSTORE_PASSWORD
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace
      - name: Collect APK
        run: |
          . android/app/version.properties
          cp android/app/build/outputs/apk/release/app-release.apk P2P-Order-Book.apk
          echo "VNAME=$versionName" >> $GITHUB_ENV
          echo "VCODE=$versionCode" >> $GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ env.VNAME }}-${{ github.run_number }}
          name: P2P Order Book ${{ env.VNAME }} (build ${{ github.run_number }})
          make_latest: true
          files: P2P-Order-Book.apk
